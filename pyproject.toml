[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ficelle-router"
version = "0.3.4"
description = "Local OpenAI-compatible strict-zero model router for AI agents"
readme = "README.md"
license = "BUSL-1.1"
requires-python = ">=3.11"
dependencies = ["cryptography>=42", "packaging>=24", "requests>=2.31"]

[project.optional-dependencies]
dev = ["pytest>=8", "build>=1.2"]

[project.scripts]
ficelle = "ficelle.cli:main"
ficelle-setup = "ficelle.install:main"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ficelle = ["assets/hermes-plugin/*/*", "assets/fonts/*", "assets/logos/*", "assets/admin/*", "assets/admin/**/*", "data/*.json", "data/benchmark/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
