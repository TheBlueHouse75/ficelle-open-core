name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Run tests
        run: python -m pytest -q
      - name: Compile Python sources
        run: python -m compileall src ficelle_router.py
      # The dashboard ships as static ES modules with no build step, so a syntax error in
      # them reaches users as a blank page. node is preinstalled on ubuntu-latest.
      # The closed pack ships its own module, injected as a separate <script type="module">
      # that registers onto window.__ficelleProViews; if it fails to parse, app.js keeps
      # running and the Pro tabs silently fall back to the core's upsell placeholders — a
      # paying user reads that as an expired license, not as a bug. Guarded by the directory
      # test because this workflow is mirrored to the core-only public repo, where an
      # unmatched glob would stay literal and fail the run.
      - name: Syntax-check the dashboard assets
        run: |
          for f in src/ficelle/assets/admin/*.js; do node --input-type=module --check < "$f"; done
          if [ -d ficelle-pro/src/ficelle_pro/assets/admin ]; then
            for f in ficelle-pro/src/ficelle_pro/assets/admin/*.js; do node --input-type=module --check < "$f"; done
          fi
