name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Run tests
        run: python -m pytest -q
      # The dashboard ships as static ES modules with no build step, so a syntax error in
      # them reaches users as a blank page. node is preinstalled on ubuntu-latest.
      - name: Syntax-check the dashboard assets
        run: for f in src/ficelle/assets/admin/*.js; do node --check "$f"; done
